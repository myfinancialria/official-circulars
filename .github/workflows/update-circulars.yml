name: Update circulars

on:
  schedule:
    - cron: "15 4 * * *"   # 09:45 IST — morning sweep
    - cron: "15 13 * * *"  # 18:45 IST — post-market sweep
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-circulars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest circulars
        run: python scripts/fetch_circulars.py

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- docs/data/circulars.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/circulars.json
          git commit -m "data: refresh circulars ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
